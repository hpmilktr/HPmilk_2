(function(){

 var language=lang(),all=list(),n=all.reduce(function(a,x){return a+Number(x.qty)},0);
 var t={

 document.getElementById('total').textContent=t.total;
 document.getElementById('checkoutButton').disabled=!n;
 document.getElementById('checkoutButton').style.opacity=n?'1':'.5';
}

 }[language]||null;
 document.documentElement.lang=language;document.documentElement.dir=rtl?'rtl':'ltr';document.title=dict.title;
 var keys=['header','continue','empty','view','place','intro','full','phone','email','city','address','wa','sendEmail','price'];
 var selectors=['header strong','header a','#empty',' #empty a','#checkout h2','#checkout p','#form label:nth-of-type(1)','#form label:nth-of-type(2)','#form label:nth-of-type(3)','#form label:nth-of-type(4)','#form label:nth-of-type(5)','#wa','#email','#summary small'];
 selectors.forEach(function(sel,i){var el=document.querySelector(sel);if(!el)return;var value=dict[keys[i]];if(i===2){var textNode=Array.from(el.childNodes).find(function(n){return n.nodeType===3&&n.textContent.trim()});if(textNode)textNode.textContent=value;return;}if(i>=6&&i<=10){var input=el.querySelector('input,textarea');el.firstChild.textContent=value;if(input)return;}else if(i===0||i===1||i===4||i===5||i>=11){el.textContent=value;}});

function message(channel){

 var words={

 }[language]||null;
 function digits(value){var out=String(value).replace(/[۰-۹]/g,function(c){return String(c.charCodeAt(0)-1776)}).replace(/[٠-٩]/g,function(c){return String(c.charCodeAt(0)-1632)});if(language==='fa')out=out.replace(/[0-9]/g,function(c){return '۰۱۲۳۴۵۶۷۸۹'[Number(c)]});return out;}
